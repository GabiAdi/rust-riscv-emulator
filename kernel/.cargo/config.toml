[build]
target = "riscv64gc.json"
rustflags = [
    "-C", "-C", "relocation-model=pic",
	"-C", "link-arg=-pie",
	"-C", "link-arg=--no-dynamic-linker",
	"-C", "code-model=medany",
	"-C", "link-arg=-zrelro","link-arg=-Tfirmware/link.ld",
]

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true
